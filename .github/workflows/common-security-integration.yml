name: Common.Security integration

on:
  pull_request:
  workflow_dispatch:

jobs:
  common-security-integration:
    runs-on: ubuntu-latest
    env:
      CommonRoot: ${{ github.workspace }}/Common
    steps:
      - name: Checkout Cafeteria
        uses: actions/checkout@v4

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: 3d7cd6238427fb6897425415baabe2443c8c5b99
          path: Common/Common.Security

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: 4f90c9fd31aaa16ffbada97e33084a5356a45859
          path: Common/Common.Diagnostics

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: e673815b7e1f29ac1c713e849762e1af522a784d
          path: Common/Common.Registration

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Cafeteria unit tests
        run: dotnet restore Aegis.Cafeteria.Tests/Aegis.Cafeteria.UnitTests/Aegis.Cafeteria.UnitTests.csproj

      - name: Build Cafeteria unit tests
        run: dotnet build Aegis.Cafeteria.Tests/Aegis.Cafeteria.UnitTests/Aegis.Cafeteria.UnitTests.csproj --no-restore --configuration Release

      - name: Run Common.Security consumer test
        run: dotnet test Aegis.Cafeteria.Tests/Aegis.Cafeteria.UnitTests/Aegis.Cafeteria.UnitTests.csproj --no-build --configuration Release --filter FullyQualifiedName~CommonSecurityConsumerIntegrationTests
