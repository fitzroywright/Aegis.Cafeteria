name: Apply and verify Aegis Engineering Diagnostics v7

on:
  push:
    branches:
      - chatgpt/aegis-engineering-diagnostics-v7
    paths:
      - .github/workflows/apply-and-verify-v7.yml

permissions:
  contents: write

jobs:
  build-v7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v7 integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          program = 'src/Aegis.Cafeteria.Services/Program.cs'
          replace_once(program,
              'using Aegis.Cafeteria.Services.Workers;\nusing Microsoft.AspNetCore.Authentication.Negotiate;',
              'using Aegis.Cafeteria.Services.Workers;\n\nusing Aegis.Engineering.Diagnostics;\n\nusing Microsoft.AspNetCore.Authentication.Negotiate;')
          replace_once(program,
              'builder.Services.AddSingleton<StipendAccountSnapshotFactory>();\n',
              'builder.Services.AddSingleton<StipendAccountSnapshotFactory>();\nbuilder.Services.AddSingleton<EngineeringDiagnosticRunStore>();\nbuilder.Services.AddSingleton<CafeteriaEngineeringDiagnosticService>();\n')
          replace_once(program,
              '''    options.AddPolicy("CafeteriaManagement", policy =>\n    {\n        policy.RequireAuthenticatedUser();\n        policy.RequireAssertion(context =>\n            management.AuthorizedGroups.Length == 0 || management.AuthorizedGroups.Any(context.User.IsInRole));\n    });\n''',
              '''    options.AddPolicy("CafeteriaManagement", policy =>\n    {\n        policy.RequireAuthenticatedUser();\n        policy.RequireAssertion(context =>\n            management.AuthorizedGroups.Length == 0 || management.AuthorizedGroups.Any(context.User.IsInRole));\n    });\n\n    options.AddPolicy("EngineeringDiagnostics", policy =>\n    {\n        policy.RequireAuthenticatedUser();\n\n        if (!builder.Environment.IsDevelopment())\n        {\n            policy.RequireAssertion(context =>\n                management.AuthorizedGroups.Length == 0 || management.AuthorizedGroups.Any(context.User.IsInRole));\n        }\n    });\n''')
          replace_once(program,
              'app.MapGet("/health", () => Results.Ok(new { status="running", application="Aegis.Cafeteria.Services", timeUtc=DateTimeOffset.UtcNow }));\n\napp.MapHub<ManagementEventsHub>("/hubs/cafeteria");',
              '''app.MapGet("/health", () => Results.Ok(new { status="running", application="Aegis.Cafeteria.Services", timeUtc=DateTimeOffset.UtcNow }));\n\napp.MapGet("/engineering/diagnostics", () => Results.Content(LcarsDiagnosticsDashboard.Html, "text/html"))\n    .RequireAuthorization("EngineeringDiagnostics");\n\napp.MapGet("/api/engineering/diagnostics/runs", async (int? take, EngineeringDiagnosticRunStore store, CancellationToken ct) =>\n{\n    IReadOnlyList<EngineeringDiagnosticRun> runs = await store.GetRecentAsync(take ?? 25, ct);\n    return Results.Ok(runs);\n}).RequireAuthorization("EngineeringDiagnostics");\n\napp.MapGet("/api/engineering/diagnostics/runs/{runId:guid}", async (Guid runId, EngineeringDiagnosticRunStore store, CancellationToken ct) =>\n{\n    EngineeringDiagnosticRun? run = await store.GetAsync(runId, ct);\n    return run is null ? Results.NotFound() : Results.Ok(run);\n}).RequireAuthorization("EngineeringDiagnostics");\n\napp.MapPost("/api/engineering/diagnostics/runs/{runId:guid}/resolve", async (Guid runId, EngineeringDiagnosticResolutionRequest request, HttpContext http, EngineeringDiagnosticRunStore store, CancellationToken ct) =>\n{\n    try\n    {\n        EngineeringDiagnosticRun? run = await store.ResolveAsync\n        (\n              runId\n            , RequireActor(http)\n            , request.Resolution\n            , ct\n        );\n        return run is null ? Results.NotFound() : Results.Ok(run);\n    }\n    catch (ArgumentException exception)\n    {\n        return Results.BadRequest(new { error = exception.Message });\n    }\n}).RequireAuthorization("EngineeringDiagnostics");\n\napp.MapPost("/api/engineering/diagnostics/run", async (EngineeringDiagnosticRunRequest request, HttpContext http, CafeteriaEngineeringDiagnosticService diagnostics, CancellationToken ct) =>\n{\n    try\n    {\n        EngineeringDiagnosticRun run = await diagnostics.RunAsync\n        (\n              request.Level\n            , RequireActor(http)\n            , request.Reason\n            , ct\n        );\n        return Results.Ok(run);\n    }\n    catch (ArgumentException exception)\n    {\n        return Results.BadRequest(new { error = exception.Message });\n    }\n}).RequireAuthorization("EngineeringDiagnostics");\n\napp.MapHub<ManagementEventsHub>("/hubs/cafeteria");''')

          main = 'src/Aegis.Cafeteria.UI/MainForm.cs'
          replace_once(main,
              'using Microsoft.Extensions.Logging;\n\nnamespace Aegis.Cafeteria.UI;',
              'using Microsoft.Extensions.Logging;\n\nusing System.Diagnostics;\n\nnamespace Aegis.Cafeteria.UI;')
          replace_once(main,
              '''        administration.DropDownItems.Add(cafeteriaAdministration);\n        menu.Items.Add(administration);\n\n        return menu;\n    }\n\n    private async Task OpenCafeteriaAdministrationAsync()''',
              '''        administration.DropDownItems.Add(cafeteriaAdministration);\n        menu.Items.Add(administration);\n\n        ToolStripMenuItem engineering = new("Engineering")\n        {\n            Font = new Font("Segoe UI", 10, FontStyle.Bold)\n        };\n        ToolStripMenuItem diagnostics = new("Aegis Engineering Diagnostics...");\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        engineering.DropDownItems.Add(diagnostics);\n        menu.Items.Add(engineering);\n\n        return menu;\n    }\n\n    private void OpenEngineeringDiagnostics()\n    {\n        CafeteriaServicesOptions cafeteriaServices = this.services.GetRequiredService<CafeteriaServicesOptions>();\n        string diagnosticsUrl = cafeteriaServices.BaseUrl.TrimEnd('/') + "/engineering/diagnostics";\n        Process.Start\n        (\n            new ProcessStartInfo\n            {\n                  FileName = diagnosticsUrl\n                , UseShellExecute = true\n            }\n        );\n    }\n\n    private async Task OpenCafeteriaAdministrationAsync()''')

          linux = 'src/Aegis.Cafeteria.UI.Linux/MainWindow.cs'
          replace_once(linux,
              '''        administration.Items.Add(priceMaintenance);\n        menu.Items.Add(administration);\n\n        return menu;\n    }\n\n    private MenuItem BuildReportMenuItem(CafeteriaReportKind kind)''',
              '''        administration.Items.Add(priceMaintenance);\n        menu.Items.Add(administration);\n\n        MenuItem engineering = new()\n        {\n              Header = "Engineering"\n            , FontWeight = FontWeight.Bold\n            , Foreground = new SolidColorBrush(Color.FromRgb(24, 45, 68))\n        };\n        MenuItem diagnostics = new() { Header = "Aegis Engineering Diagnostics..." };\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        engineering.Items.Add(diagnostics);\n        menu.Items.Add(engineering);\n\n        return menu;\n    }\n\n    private void OpenEngineeringDiagnostics()\n    {\n        CafeteriaServicesOptions cafeteriaServices = this.services.GetRequiredService<CafeteriaServicesOptions>();\n        string diagnosticsUrl = cafeteriaServices.BaseUrl.TrimEnd('/') + "/engineering/diagnostics";\n        Process.Start\n        (\n            new ProcessStartInfo\n            {\n                  FileName = diagnosticsUrl\n                , UseShellExecute = true\n            }\n        );\n    }\n\n    private MenuItem BuildReportMenuItem(CafeteriaReportKind kind)''')
          '@ | python -

      - name: Verify naming and static audit
        shell: pwsh
        run: |
          $forbidden = git grep -ni 'starfleet' -- ':!*.md' 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "Forbidden application terminology found:`n$forbidden"; exit 1 }
          python scripts/static-audit.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aegis.Cafeteria.sln

      - name: Build
        run: dotnet build Aegis.Cafeteria.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Aegis.Cafeteria.sln --configuration Release --no-build

      - name: Commit verified v7 integration
        shell: pwsh
        run: |
          git rm .github/workflows/apply-and-verify-v7.yml
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add src/Aegis.Cafeteria.Services/Program.cs src/Aegis.Cafeteria.UI/MainForm.cs src/Aegis.Cafeteria.UI.Linux/MainWindow.cs
          git commit -m "Integrate Aegis Engineering Diagnostics v7"
          git push origin HEAD:chatgpt/aegis-engineering-diagnostics-v7
