name: Refund guard verification

on:
  push:
    branches:
      - chatgpt/aegis-engineering-diagnostics-v7
    paths:
      - .github/workflows/refund-guard-and-management-tabs.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Patch refund selection
        shell: pwsh
        run: |
          $windowsPath = 'src/Aegis.Cafeteria.UI/MainForm.cs'
          $windows = Get-Content $windowsPath -Raw
          $oldWindows = @'
            var rowType = selectedRow.GetType();
            var kind = rowType.GetProperty("Kind")?.GetValue(selectedRow)?.ToString();
            var referenceValue = rowType.GetProperty("ReferenceId")?.GetValue(selectedRow);
            if (string.Equals(kind, "Purchase", StringComparison.OrdinalIgnoreCase) && referenceValue is Guid orderId)
                return await this.orderQuery.GetAsync(orderId);
'@
          $newWindows = @'
            Type rowType = selectedRow.GetType();
            string? kind = rowType.GetProperty("Kind")?.GetValue(selectedRow)?.ToString();
            object? referenceValue = rowType.GetProperty("ReferenceId")?.GetValue(selectedRow);

            if (string.Equals(kind, "Refund", StringComparison.OrdinalIgnoreCase))
            {
                MessageBox.Show
                (
                      this
                    , "Refund entries cannot be refunded. Select the original purchase instead."
                    , "Refund"
                    , MessageBoxButtons.OK
                    , MessageBoxIcon.Information
                );
                return null;
            }

            if (string.Equals(kind, "Purchase", StringComparison.OrdinalIgnoreCase) && referenceValue is Guid orderId)
            {
                return await this.orderQuery.GetAsync(orderId);
            }
'@
          if (-not $windows.Contains($oldWindows)) { throw 'Windows refund marker not found.' }
          Set-Content -Path $windowsPath -Value $windows.Replace($oldWindows, $newWindows) -Encoding utf8

          $linuxPath = 'src/Aegis.Cafeteria.UI.Linux/MainWindow.cs'
          $linux = Get-Content $linuxPath -Raw
          $oldLinux = @'
        if (transactions.SelectedItem is not TransactionRow selected ||
            !string.Equals(selected.Transaction.Kind, "Purchase", StringComparison.OrdinalIgnoreCase))
        {
            status.Text = "Select a purchase from this month's transactions to refund.";
            return;
        }
'@
          $newLinux = @'
        if (transactions.SelectedItem is not TransactionRow selected)
        {
            status.Text = "Select a purchase from this month's transactions to refund.";
            return;
        }

        if (string.Equals(selected.Transaction.Kind, "Refund", StringComparison.OrdinalIgnoreCase))
        {
            status.Text = "Refund entries cannot be refunded. Select the original purchase instead.";
            return;
        }

        if (!string.Equals(selected.Transaction.Kind, "Purchase", StringComparison.OrdinalIgnoreCase))
        {
            status.Text = "Select a purchase from this month's transactions to refund.";
            return;
        }
'@
          if (-not $linux.Contains($oldLinux)) { throw 'Linux refund marker not found.' }
          Set-Content -Path $linuxPath -Value $linux.Replace($oldLinux, $newLinux) -Encoding utf8

      - name: Verify UI rules
        shell: pwsh
        run: |
          $html = Get-Content src/Aegis.Cafeteria.Management/wwwroot/index.html -Raw
          if ($html -match 'Development Tools') { throw 'Development Tools are visible.' }
          if ($html -notmatch 'data-tab="rates"') { throw 'Rates tab missing.' }
          if ($html -notmatch 'data-tab="month-opening"') { throw 'Month Opening tab missing.' }
          $windows = Get-Content src/Aegis.Cafeteria.UI/MainForm.cs -Raw
          if ($windows -notmatch 'Refund entries cannot be refunded') { throw 'Windows refund guard missing.' }
          $linux = Get-Content src/Aegis.Cafeteria.UI.Linux/MainWindow.cs -Raw
          if ($linux -notmatch 'Refund entries cannot be refunded') { throw 'Linux refund guard missing.' }

      - name: Static audit
        run: python scripts/static-audit.py

      - name: Build solution
        run: dotnet build Aegis.Cafeteria.slnx --configuration Release

      - name: Commit verified patch
        shell: pwsh
        run: |
          git rm .github/workflows/refund-guard-and-management-tabs.yml
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add src/Aegis.Cafeteria.UI/MainForm.cs src/Aegis.Cafeteria.UI.Linux/MainWindow.cs
          git commit -m "Prevent refunding refund entries"
          git push origin HEAD:chatgpt/aegis-engineering-diagnostics-v7
