name: Add management services wiring

on:
  push:
    branches:
      - chatgpt/aegis-engineering-diagnostics-v7
    paths:
      - .github/workflows/add-management-services-wiring.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wire Development management console to Services
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path('src/Aegis.Cafeteria.Services/Program.cs')
          text = p.read_text(encoding='utf-8')

          old = '''if (builder.Environment.IsDevelopment())
          {
              builder.Services.AddEndpointsApiExplorer();
              builder.Services.AddSwaggerGen();
          }
          builder.Services.AddSingleton<ServiceEventRealtimePublisher>();'''
          new = '''if (builder.Environment.IsDevelopment())
          {
              builder.Services.AddEndpointsApiExplorer();
              builder.Services.AddSwaggerGen();
              builder.Services.AddCors
              (
                  options => options.AddPolicy
                  (
                        "DevelopmentManagement"
                      , policy => policy
                          .WithOrigins("http://localhost:5090")
                          .AllowAnyHeader()
                          .AllowAnyMethod()
                          .AllowCredentials()
                  )
              );
          }
          builder.Services.AddSingleton<ServiceEventRealtimePublisher>();'''
          if old not in text:
              raise SystemExit('Could not find Development services registration marker.')
          text = text.replace(old, new, 1)

          old = '''if (app.Environment.IsDevelopment())
          {
              app.UseSwagger();
              app.UseSwaggerUI();
          }

          app.UseAuthentication();'''
          new = '''if (app.Environment.IsDevelopment())
          {
              app.UseSwagger();
              app.UseSwaggerUI();
              app.UseCors("DevelopmentManagement");
          }

          app.UseAuthentication();'''
          if old not in text:
              raise SystemExit('Could not find Development middleware marker.')
          text = text.replace(old, new, 1)

          marker = '''app.MapGet("/api/management/customers/{customerId:int}/credit-policy", async (int customerId, CustomerCreditPolicyStore policies, IWorkforceReferenceSource workforce, CancellationToken ct) =>
          {'''
          endpoint = '''app.MapGet("/api/management/customers", async (string? search, int? take, IWorkforceReferenceSource workforce, CancellationToken ct) =>
          {
              string term = (search ?? string.Empty).Trim();
              int limit = Math.Clamp(take ?? 25, 1, 100);

              if (term.Length < 2)
              {
                  return Results.Ok(Array.Empty<object>());
              }

              IReadOnlyList<ExternalCustomerSnapshot> employees = await workforce.GetCustomersAsync(ct);
              string normalized = term.Replace(" ", string.Empty, StringComparison.Ordinal).ToUpperInvariant();

              object[] matches = employees
                  .Where(employee => employee.IsEligibleForCafeteriaCredit)
                  .Where(employee =>
                         employee.Name.Contains(term, StringComparison.OrdinalIgnoreCase)
                      || (!string.IsNullOrWhiteSpace(employee.Code) && employee.Code.Contains(term, StringComparison.OrdinalIgnoreCase))
                      || (!string.IsNullOrWhiteSpace(employee.Trn) && employee.Trn.Replace(" ", string.Empty, StringComparison.Ordinal).Contains(normalized, StringComparison.OrdinalIgnoreCase)))
                  .OrderBy(employee => employee.Name)
                  .Take(limit)
                  .Select(employee => (object)new
                  {
                        employee.CustomerId
                      , employee.Name
                      , employee.Code
                      , employee.Trn
                      , employee.Department
                  })
                  .ToArray();

              return Results.Ok(matches);
          }).RequireAuthorization("CafeteriaManagement");

          ''' + marker
          if marker not in text:
              raise SystemExit('Could not find management customer endpoint marker.')
          text = text.replace(marker, endpoint, 1)
          p.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Static audit
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python scripts/static-audit.py

      - name: Build complete solution
        run: dotnet build Aegis.Cafeteria.slnx --configuration Release

      - name: Commit integrated management console
        shell: pwsh
        run: |
          git rm .github/workflows/add-management-services-wiring.yml
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add src/Aegis.Cafeteria.Services/Program.cs
          git commit -m "Wire Cafeteria Management web console to Services"
          git push origin HEAD:chatgpt/aegis-engineering-diagnostics-v7
