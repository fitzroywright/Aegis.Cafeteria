name: Cleanup diagnostics UI

on:
  push:
    branches:
      - chatgpt/aegis-engineering-diagnostics-v7
    paths:
      - .github/workflows/cleanup-diagnostics-ui.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Update diagnostics-facing labels and menu placement
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          dashboard = Path('src/Aegis.Cafeteria.Services/Engineering/Diagnostics/LcarsDiagnosticsDashboard.cs')
          text = dashboard.read_text(encoding='utf-8')
          replacements = {
              '<title>Aegis Engineering Diagnostics</title>': '<title>Engineering Diagnostics</title>',
              '<h1>Aegis Engineering Diagnostics</h1><p>Aegis.Cafeteria • Engineering Console</p>': '<h1>Engineering Diagnostics</h1><p>Cafeteria • Engineering Console</p>',
              '<span class="chip">SYSTEM: AEGIS.CAFETERIA</span>': '<span class="chip">SYSTEM: CAFETERIA</span>',
              'AEGIS ENGINEERING DIAGNOSTICS • Diagnostic runs are auditable.': 'ENGINEERING DIAGNOSTICS • Diagnostic runs are auditable.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Dashboard marker not found: {old}')
              text = text.replace(old, new)
          dashboard.write_text(text, encoding='utf-8')

          windows = 'src/Aegis.Cafeteria.UI/MainForm.cs'
          replace_once(windows,
          '''        administration.DropDownItems.Add(cafeteriaAdministration);\n        menu.Items.Add(administration);\n\n        ToolStripMenuItem engineering = new("Engineering")\n        {\n            Font = new Font("Segoe UI", 10, FontStyle.Bold)\n        };\n        ToolStripMenuItem diagnostics = new("Aegis Engineering Diagnostics...");\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        engineering.DropDownItems.Add(diagnostics);\n        menu.Items.Add(engineering);''',
          '''        administration.DropDownItems.Add(cafeteriaAdministration);\n        administration.DropDownItems.Add(new ToolStripSeparator());\n        ToolStripMenuItem diagnostics = new("Diagnostics");\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        administration.DropDownItems.Add(diagnostics);\n        menu.Items.Add(administration);''')

          linux = 'src/Aegis.Cafeteria.UI.Linux/MainWindow.cs'
          replace_once(linux,
          '''        administration.Items.Add(priceMaintenance);\n        menu.Items.Add(administration);\n\n        MenuItem engineering = new()\n        {\n              Header = "Engineering"\n            , FontWeight = FontWeight.Bold\n            , Foreground = new SolidColorBrush(Color.FromRgb(24, 45, 68))\n        };\n        MenuItem diagnostics = new() { Header = "Aegis Engineering Diagnostics..." };\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        engineering.Items.Add(diagnostics);\n        menu.Items.Add(engineering);''',
          '''        administration.Items.Add(priceMaintenance);\n        administration.Items.Add(new Separator());\n        MenuItem diagnostics = new() { Header = "Diagnostics" };\n        diagnostics.Click += (_, _) => OpenEngineeringDiagnostics();\n        administration.Items.Add(diagnostics);\n        menu.Items.Add(administration);''')
          '@ | python -

      - name: Verify diagnostics-facing wording
        shell: pwsh
        run: |
          $dashboard = Get-Content src/Aegis.Cafeteria.Services/Engineering/Diagnostics/LcarsDiagnosticsDashboard.cs -Raw
          $htmlStart = $dashboard.IndexOf('<!doctype html>')
          if ($htmlStart -lt 0) { throw 'Dashboard HTML not found.' }
          $html = $dashboard.Substring($htmlStart)
          if ($html -match 'Aegis') { throw 'Diagnostics dashboard HTML still contains Aegis.' }
          $windows = Get-Content src/Aegis.Cafeteria.UI/MainForm.cs -Raw
          if ($windows -match 'Aegis Engineering Diagnostics') { throw 'Windows diagnostics label still contains Aegis.' }
          $linux = Get-Content src/Aegis.Cafeteria.UI.Linux/MainWindow.cs -Raw
          if ($linux -match 'Aegis Engineering Diagnostics') { throw 'Linux diagnostics label still contains Aegis.' }

      - name: Build
        run: dotnet build Aegis.Cafeteria.slnx --configuration Release

      - name: Commit cleanup
        shell: pwsh
        run: |
          git rm .github/workflows/cleanup-diagnostics-ui.yml
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add src/Aegis.Cafeteria.Services/Engineering/Diagnostics/LcarsDiagnosticsDashboard.cs src/Aegis.Cafeteria.UI/MainForm.cs src/Aegis.Cafeteria.UI.Linux/MainWindow.cs
          git commit -m "Simplify diagnostics UI labels and menu placement"
          git push origin HEAD:chatgpt/aegis-engineering-diagnostics-v7
