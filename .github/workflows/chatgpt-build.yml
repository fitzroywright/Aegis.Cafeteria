name: Aegis Cafeteria Build

on:
  push:
    branches:
      - master
      - development/current
      - development/post-rc1
      - chatgpt/enable-messaging-and-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Select Common repository token
        id: common_repo_token
        shell: pwsh
        env:
          DEDICATED_TOKEN: ${{ secrets.COMMON_SECURITY_TOKEN }}
          REPOSITORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:DEDICATED_TOKEN)) {
            "token=$env:DEDICATED_TOKEN" >> $env:GITHUB_OUTPUT
          } else {
            "token=$env:REPOSITORY_TOKEN" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout Aegis.Cafeteria
        uses: actions/checkout@v4
        with:
          path: Aegis.Cafeteria

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: main
          path: Common/Common.Security
          token: ${{ steps.common_repo_token.outputs.token }}
          fetch-depth: 1

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: main
          path: Common/Common.Diagnostics
          token: ${{ steps.common_repo_token.outputs.token }}
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: Aegis.Cafeteria
        run: dotnet restore --configfile NuGet.config

      - name: Build
        working-directory: Aegis.Cafeteria
        run: dotnet build --no-restore --configuration Debug

      - name: Test
        working-directory: Aegis.Cafeteria
        run: dotnet test --no-build --configuration Debug
