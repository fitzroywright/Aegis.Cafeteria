name: ChatGPT Branch Build

on:
  push:
    branches:
      - chatgpt/cafeteria-recovery
      - chatgpt/enable-messaging-and-tests
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        shell: pwsh
        run: dotnet nuget update source github-common --username fitzroywright --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.config

      - name: Restore
        run: dotnet restore --configfile NuGet.config

      - name: Build
        run: dotnet build --no-restore --configuration Debug

      - name: Test
        run: dotnet test --no-build --configuration Debug
